<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f4ee;
        color: #171717;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        padding: 48px 24px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 10vw, 112px);
        font-weight: 800;
        line-height: 0.95;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello world.</h1>
    </main>
  </body>
</html>
